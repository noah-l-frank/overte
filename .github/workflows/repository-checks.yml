name: Repository checks

# PR jobs execute with read-only permissions. The protected PR-target job
# authenticates workflow sources without checking out or executing a candidate.
on: # zizmor: ignore[dangerous-triggers] PR-target runs only the read-only protected source policy; it never checks out candidate code.
  pull_request:
    branches: [main, apple-main, apple-ios, android-main, android-phone, android-vr, android-vr-pico]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_target:
    branches: [main, apple-main, apple-ios, android-main, android-phone, android-vr, android-vr-pico]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request to qualify with this reviewed controller
        type: string
        required: true
      run_regression:
        description: Compatibility input; protected policy selects all required work
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event.action == 'edited' && !github.event.changes.base && github.run_id || 'execution' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select exact candidate tasks
    if: github.event_name != 'pull_request_target' && !github.event.pull_request.draft && !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      active: ${{ steps.bootstrap.outputs.active }}
      context_json: ${{ steps.context.outputs.context_json }}
      controller: ${{ steps.context.outputs.controller }}
      source: ${{ steps.context.outputs.source }}
      target: ${{ steps.context.outputs.target }}
      base: ${{ steps.context.outputs.base }}
      head: ${{ steps.context.outputs.head }}
      tree: ${{ steps.context.outputs.tree }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      host: ${{ steps.plan.outputs.host }}
      npm: ${{ steps.plan.outputs.npm }}
      native: ${{ steps.plan.outputs.native }}
      codeql: ${{ steps.plan.outputs.codeql }}
      security: ${{ steps.plan.outputs.security }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      ios_build: ${{ steps.plan.outputs.ios_build }}
      native_mode: ${{ steps.plan.outputs.native_mode }}
      npm_projects: ${{ steps.plan.outputs.npm_projects }}
      codeql_languages: ${{ steps.plan.outputs.codeql_languages }}
      full_host: ${{ steps.plan.outputs.full_host }}
      setup_json: ${{ steps.plan.outputs.setup_json }}
      browser_projects: ${{ steps.plan.outputs.browser_projects }}
      android_compile_products: ${{ steps.plan.outputs.android_compile_products }}
      android_native_products: ${{ steps.plan.outputs.android_native_products }}
    steps:
      - name: Check out the trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Detect installed controller before bootstrap
        id: bootstrap
        run: |
          if test -f trusted/tools/repository-checks/pr_ci.py; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate immutable PR inputs
        if: steps.bootstrap.outputs.active == 'true'
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          controller=$(git -C trusted rev-parse HEAD)
          python3 -I -S -B trusted/tools/repository-checks/pr_ci.py context \
            --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --number "$PR_NUMBER" --controller "$controller" \
            --out context.json --output "$GITHUB_OUTPUT"
      - name: Check out only the authenticated candidate
        if: steps.bootstrap.outputs.active == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.context.outputs.source }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Select owners from complete immutable trees
        if: steps.bootstrap.outputs.active == 'true'
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -S -B trusted/tools/repository-checks/pr_ci.py plan \
            --context context.json --candidate candidate --out plan.json --output "$GITHUB_OUTPUT"

  policy:
    name: Authenticate candidate policy
    needs: plan
    if: needs.plan.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Check out the immutable trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.controller }}
          path: trusted
          persist-credentials: false
      - name: Check out the immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact policy and source identities
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_JSON: ${{ needs.plan.outputs.context_json }}
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
        run: |
          python3 -I -S -B trusted/tools/repository-checks/pr_ci.py policy \
            --context-json "$CONTEXT_JSON" --plan-json "$PLAN_JSON" --candidate candidate

  host:
    name: Host contracts
    needs: [plan, policy]
    if: needs.plan.outputs.active == 'true' && needs.plan.outputs.host == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Check out the immutable trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.controller }}
          path: trusted
          persist-credentials: false
      - name: Check out the immutable private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.15'
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - name: Set up Java for complete host contracts
        if: needs.plan.outputs.full_host == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Python dependencies from trusted requirements
        env:
          FULL_HOST: ${{ needs.plan.outputs.full_host }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pr-ci-venv"
          requirements=trusted/tests/requirements-repository.txt
          if test "$FULL_HOST" = true; then
            requirements=trusted/tests/requirements-host.txt
          fi
          "$RUNNER_TEMP/pr-ci-venv/bin/python" -m pip install \
            --disable-pip-version-check --requirement "$requirements"
      - name: Prepare the reviewed image-test dependency when selected
        if: needs.plan.outputs.full_host != 'true' && contains(fromJSON(needs.plan.outputs.setup_json), 'pillow')
        run: |
          pillow=$(sed -n '/^Pillow==[0-9][0-9.]*$/p' trusted/tests/requirements-host.txt)
          test -n "$pillow" && test "$(printf '%s\n' "$pillow" | wc -l)" -eq 1
          "$RUNNER_TEMP/pr-ci-venv/bin/python" -m pip install --disable-pip-version-check -- "$pillow"
      - name: Install complete host prerequisites
        if: needs.plan.outputs.full_host == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build qml-module-qttest qtdeclarative5-dev-tools \
            qt6-base-dev qt6-base-dev-tools libglm-dev qtdeclarative5-dev \
            qml-module-qtquick2 qml-module-qtquick-controls2 qml-module-qtquick-layouts \
            qml-module-qtquick-window2 qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-webchannel-dev libqt5webchannel5-dev qml-module-qt-labs-folderlistmodel \
            qml6-module-qt-labs-folderlistmodel qml6-module-qtqml qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qt-labs-settings qml6-module-qtquick-dialogs qml6-module-qttest
          pkg-config --exists Qt5Quick Qt5WebChannel Qt5Network Qt6Quick Qt6WebChannel Qt6Network
          test -x /usr/lib/qt6/bin/qmltestrunner
      - name: Install selected Qt6 and portable compiler prerequisites
        if: needs.plan.outputs.full_host != 'true' && contains(fromJSON(needs.plan.outputs.setup_json), 'qt6-qml')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build g++ pkg-config qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtqml-workerscript qml6-module-qttest
          pkg-config --exists Qt6Quick Qt6Test
      - name: Prepare tokenless namespace execution
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          if ! unshare --user --map-root-user --net /usr/bin/true; then
            test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns
            test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            unshare --user --map-root-user --net /usr/bin/true
          fi
      - name: Execute selected host contracts without credentials
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_JSON: ${{ needs.plan.outputs.context_json }}
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
          FULL_HOST: ${{ needs.plan.outputs.full_host }}
        run: |
          node_root=$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")
          prepared=(--prepared-root "$node_root")
          if test "$FULL_HOST" = true; then
            prepared+=(--prepared-root "$(readlink -f "$JAVA_HOME")")
          fi
          "$RUNNER_TEMP/pr-ci-venv/bin/python" -I -S -B trusted/tools/repository-checks/pr_ci.py execute \
            --lane host --context-json "$CONTEXT_JSON" --plan-json "$PLAN_JSON" \
            --candidate candidate --out tasks.json "${prepared[@]}"
      - name: Publish authenticated host task results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pr-ci-tasks-${{ github.run_id }}-${{ github.run_attempt }}-host
          path: tasks.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  npm:
    name: npm (${{ matrix.project }})
    needs: [plan, policy]
    if: needs.plan.outputs.active == 'true' && needs.plan.outputs.npm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ contains(fromJSON(needs.plan.outputs.browser_projects), matrix.project) && 45 || 25 }}
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.npm_projects) }}
    steps:
      - name: Check out the immutable trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.controller }}
          path: trusted
          persist-credentials: false
      - name: Check out the immutable private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.15'
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - name: Prepare tokenless namespace execution
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          if ! unshare --user --map-root-user --net /usr/bin/true; then
            test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns
            test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            unshare --user --map-root-user --net /usr/bin/true
          fi
      - name: Prepare the isolated browser runtime only for changed browser code
        if: contains(fromJSON(needs.plan.outputs.browser_projects), matrix.project)
        id: browser
        run: |
          set -euo pipefail
          # Trusted literal installer, never a candidate-provided package CLI.
          if ! test -x /opt/google/chrome/chrome; then
            npm exec --yes --ignore-scripts --package=playwright@1.63.0 -- playwright install chrome
          fi
          test -f /opt/google/chrome/chrome
          ldd /opt/google/chrome/chrome > "$RUNNER_TEMP/pr-ci-chrome-libraries.txt"
          if grep -q 'not found' "$RUNNER_TEMP/pr-ci-chrome-libraries.txt"; then
            npm exec --yes --ignore-scripts --package=playwright@1.63.0 -- playwright install-deps chromium
          fi
          /opt/google/chrome/chrome --product-version
          # This image only supplies the offline container boundary. The selected
          # Node/browser/system runtimes are mounted read-only by the launcher.
          docker pull ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
          echo 'executable=/opt/google/chrome/chrome' >> "$GITHUB_OUTPUT"
      - name: Execute the selected package owner without credentials
        id: execution
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_JSON: ${{ needs.plan.outputs.context_json }}
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
          PROJECT: ${{ matrix.project }}
          BROWSER_EXECUTABLE: ${{ steps.browser.outputs.executable }}
        run: |
          node_root=$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")
          prepared=(--prepared-root "$node_root")
          if test -n "$BROWSER_EXECUTABLE"; then
            prepared+=(--prepared-root "$(dirname "$BROWSER_EXECUTABLE")" --browser-executable "$BROWSER_EXECUTABLE")
          fi
          python3 -I -S -B trusted/tools/repository-checks/pr_ci.py execute \
            --lane npm --project "$PROJECT" --context-json "$CONTEXT_JSON" \
            --plan-json "$PLAN_JSON" --candidate candidate "${prepared[@]}" \
            --out tasks.json --output "$GITHUB_OUTPUT"
      - name: Publish authenticated package task results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ steps.execution.outputs.artifact_name }}
          path: tasks.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  native:
    name: Native C++ owner
    needs: [plan, policy]
    if: needs.plan.outputs.active == 'true' && needs.plan.outputs.native == 'true' && github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/native-tests.yml
    with:
      mode: ${{ needs.plan.outputs.native_mode }}
      context_json: ${{ needs.plan.outputs.context_json }}
      plan_json: ${{ needs.plan.outputs.plan_json }}
      controller: ${{ needs.plan.outputs.controller }}
      source: ${{ needs.plan.outputs.source }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: [plan, policy]
    if: needs.plan.outputs.active == 'true' && needs.plan.outputs.codeql == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.codeql_languages) }}
    steps:
      - name: Check out the immutable trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.controller }}
          path: trusted
          persist-credentials: false
      - name: Check out the immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize the pinned CodeQL extractor
        id: init
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.2/codeql-bundle-linux64.tar.zst
          languages: ${{ matrix.language }}
          build-mode: none
          source-root: candidate
          config-file: ./trusted/.github/codeql/codeql-config.yml
      - name: Require the reviewed extractor version
        env:
          CODEQL_VERSION: ${{ steps.init.outputs.codeql-version }}
        run: test "$CODEQL_VERSION" = 2.27.2
      - name: Analyze the exact PR merge source
        id: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          checkout_path: candidate
          sha: ${{ needs.plan.outputs.source }}
          ref: refs/pull/${{ fromJSON(needs.plan.outputs.context_json).number }}/merge
          category: /language:${{ matrix.language }}
          wait-for-processing: false
      - name: Record the native upload identity
        env:
          CONTEXT_JSON: ${{ needs.plan.outputs.context_json }}
          CODEQL_LANGUAGE: ${{ matrix.language }}
          CODEQL_SARIF_ID: ${{ steps.analyze.outputs.sarif-id }}
        run: |
          python3 -I -S -B trusted/tools/repository-checks/pr_ci.py upload-proof \
            --context-json "$CONTEXT_JSON" --language "$CODEQL_LANGUAGE" \
            --sarif "$CODEQL_SARIF_ID" --out upload.json
      - name: Publish the native upload identity
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: codeql-upload-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.language }}
          path: upload.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  security:
    name: Workflow security
    needs: [plan, policy]
    if: needs.plan.outputs.active == 'true' && needs.plan.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the immutable trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.controller }}
          path: trusted
          persist-credentials: false
      - name: Check out the immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable action references as data
        run: python3 -I -S -B trusted/tools/workflow-security/check-action-pins.py --root candidate
      - name: Install checksum-verified static analyzers
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          ZIZMOR_SHA256: ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/workflow-security-tools"
          mkdir -p "$tools_dir/bin"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tools_dir/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/woodruffw/zizmor/releases/download/v1.30.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            --output "$tools_dir/zizmor.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tools_dir/gitleaks.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$tools_dir/actionlint.tar.gz" \
            "$ZIZMOR_SHA256" "$tools_dir/zizmor.tar.gz" \
            "$GITLEAKS_SHA256" "$tools_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$tools_dir/actionlint.tar.gz" -C "$tools_dir/bin" actionlint
          tar -xzf "$tools_dir/zizmor.tar.gz" -C "$tools_dir/bin" zizmor
          tar -xzf "$tools_dir/gitleaks.tar.gz" -C "$tools_dir/bin" gitleaks
      - name: Lint candidate workflow syntax with trusted configuration
        env:
          SHELLCHECK_OPTS: --external-sources=false
        run: |
          "$RUNNER_TEMP/workflow-security-tools/bin/actionlint" \
            -config-file trusted/.github/actionlint.yaml -no-color -shellcheck= \
            candidate/.github/workflows/*.yml
      - name: Audit candidate workflow security
        if: always()
        run: |
          "$RUNNER_TEMP/workflow-security-tools/bin/zizmor" --offline --min-severity medium candidate/.github/workflows
      - name: Scan candidate workflows for secrets with redacted output
        if: always()
        run: |
          "$RUNNER_TEMP/workflow-security-tools/bin/gitleaks" dir --redact=100 --no-banner --no-color candidate/.github

  android:
    name: Android product owner
    needs: [plan, policy]
    if: needs.plan.outputs.active == 'true' && needs.plan.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the immutable trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.controller }}
          path: trusted
          persist-credentials: false
      - name: Check out the immutable private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.15'
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - name: Set up Java for complete host contracts
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Python dependencies from trusted requirements
        env:
          FULL_HOST: 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/pr-ci-venv"
          requirements=trusted/tests/requirements-repository.txt
          if test "$FULL_HOST" = true; then
            requirements=trusted/tests/requirements-host.txt
          fi
          "$RUNNER_TEMP/pr-ci-venv/bin/python" -m pip install \
            --disable-pip-version-check --requirement "$requirements"
      - name: Install complete host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build qml-module-qttest qtdeclarative5-dev-tools \
            qt6-base-dev qt6-base-dev-tools libglm-dev qtdeclarative5-dev \
            qml-module-qtquick2 qml-module-qtquick-controls2 qml-module-qtquick-layouts \
            qml-module-qtquick-window2 qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-webchannel-dev libqt5webchannel5-dev qml-module-qt-labs-folderlistmodel \
            qml6-module-qt-labs-folderlistmodel qml6-module-qtqml qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qt-labs-settings qml6-module-qtquick-dialogs qml6-module-qttest
          pkg-config --exists Qt5Quick Qt5WebChannel Qt5Network Qt6Quick Qt6WebChannel Qt6Network
          test -x /usr/lib/qt6/bin/qmltestrunner
      - name: Prepare tokenless namespace execution
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          if ! unshare --user --map-root-user --net /usr/bin/true; then
            test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns
            test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            unshare --user --map-root-user --net /usr/bin/true
          fi
      - name: Restore the checksum-bound Android Java API cache
        if: needs.plan.outputs.android_compile_products != '[]'
        id: android-qt-api-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/pr-ci-android-qt-api/QtAndroid.jar
          key: pr-ci-android-qt-api-a9f64f066766e3908d64183a49c0722aff09495c5f17768213a2989a73edf893
      - name: Prepare actual Android SDK and Java API inputs only when selected
        if: needs.plan.outputs.android_compile_products != '[]'
        id: android-api
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk"
          if ! test -f "$sdk/platforms/android-36/android.jar" || ! test -x "$sdk/build-tools/36.0.0/aapt2"; then
            "$sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' </dev/null
          fi
          python3 -I -S -B trusted/tools/repository-checks/pr_ci_android.py prepare \
            --sdk "$sdk" --destination "$RUNNER_TEMP/pr-ci-android-api" \
            --qt-api-cache "$RUNNER_TEMP/pr-ci-android-qt-api/QtAndroid.jar"
          # The trusted helper atomically refreshes an optional cache leaf. Do
          # not follow a restored cache alias with an additional shell copy.
          qt_api_cache="$RUNNER_TEMP/pr-ci-android-qt-api/QtAndroid.jar"
          if test -f "$qt_api_cache" && test ! -L "$qt_api_cache" \
              && test "$(realpath -- "$qt_api_cache")" = "$qt_api_cache" \
              && printf '%s  %s\n' a9f64f066766e3908d64183a49c0722aff09495c5f17768213a2989a73edf893 "$qt_api_cache" \
                | sha256sum --check --strict; then
            echo 'cache_ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save only the verified small Android Java API cache
        if: needs.plan.outputs.android_compile_products != '[]' && steps.android-api.outputs.cache_ready == 'true' && steps.android-qt-api-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/pr-ci-android-qt-api/QtAndroid.jar
          key: pr-ci-android-qt-api-a9f64f066766e3908d64183a49c0722aff09495c5f17768213a2989a73edf893
      - name: Require the selected Android product validation
        env:
          CONTEXT_JSON: ${{ needs.plan.outputs.context_json }}
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
          FULL_HOST: 'true'
          COMPILE_PRODUCTS: ${{ needs.plan.outputs.android_compile_products }}
        run: |
          node_root=$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")
          prepared=(--prepared-root "$node_root")
          if test "$FULL_HOST" = true; then
            prepared+=(--prepared-root "$(readlink -f "$JAVA_HOME")")
          fi
          if test "$COMPILE_PRODUCTS" != '[]'; then
            prepared+=(--prepared-root "$RUNNER_TEMP/pr-ci-android-api" --android-runtime "$RUNNER_TEMP/pr-ci-android-api")
          fi
          "$RUNNER_TEMP/pr-ci-venv/bin/python" -I -S -B trusted/tools/repository-checks/pr_ci.py platform \
            --lane android --context-json "$CONTEXT_JSON" --plan-json "$PLAN_JSON" \
            --candidate candidate "${prepared[@]}"

  ios:
    name: iOS product owner
    needs: [plan, policy]
    if: needs.plan.outputs.active == 'true' && needs.plan.outputs.ios == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-ci-ios.yml
    permissions:
      contents: read
      actions: write
      pull-requests: read
    with:
      context_json: ${{ needs.plan.outputs.context_json }}
      plan_json: ${{ needs.plan.outputs.plan_json }}
      controller: ${{ needs.plan.outputs.controller }}
      source: ${{ needs.plan.outputs.source }}
      build_required: ${{ needs.plan.outputs.ios_build == 'true' }}

  ci-execution:
    name: Candidate execution receipt
    needs: [plan, policy, host, npm, native, codeql, security, android, ios]
    if: always() && needs.plan.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Check out only the immutable trusted verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.controller }}
          path: trusted
          persist-credentials: false
      - name: Require every selected owner and unchanged PR identities
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_JSON: ${{ needs.plan.outputs.context_json }}
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
          OWNER_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -I -S -B trusted/tools/repository-checks/pr_ci.py complete \
            --context-json "$CONTEXT_JSON" --plan-json "$PLAN_JSON" \
            --needs-json "$OWNER_RESULTS" --out result.json
      - name: Publish the exact native execution receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pr-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: result.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  source-policy:
    name: ${{ github.event_name == 'pull_request_target' && 'source-policy' || 'Source policy not applicable' }}
    if: github.event_name == 'pull_request_target' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the protected source policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Authenticate workflow sources without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          controller=$(git -C trusted rev-parse HEAD)
          python3 -I -S -B trusted/tools/repository-checks/pr_ci.py source-policy \
            --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --number "$PR_NUMBER" --controller "$controller"

  required-ci:
    name: ${{ needs.plan.outputs.active == 'true' && 'required-ci' || 'Execution observer has no acceptance authority' }}
    needs: [plan, ci-execution]
    if: always() && needs.plan.outputs.active == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      security-events: read
    steps:
      - name: Check out only the protected observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.controller }}
          path: trusted
          persist-credentials: false
      - name: Observe genuine native owners without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          controller=$(git -C trusted rev-parse HEAD)
          python3 -I -S -B trusted/tools/repository-checks/pr_ci.py gate \
            --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --number "$PR_NUMBER" --controller "$controller"
