name: Automatic branch cleanup

# Automatic history adoption waits for the selective-CI target rollout.
# Explicit report/apply operations retain their complete existing safeguards.
# Candidate trees and downloaded artifacts are never executed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Report eligible branches or back up and delete them
        type: choice
        required: true
        default: report
        options: [report, apply, sync-completion]
      sender_run_id: {description: Exact manual Sync run, type: string, required: false, default: ''}
      sender_run_attempt: {description: Original manual Sync attempt, type: string, required: false, default: ''}
      sender_source_sha: {description: Protected manual Sync source, type: string, required: false, default: ''}
      gate_run_id: {description: Exact originating Sync gate, type: string, required: false, default: ''}
      gate_run_attempt: {description: Original Sync gate attempt, type: string, required: false, default: ''}
      pull_request: {description: Original associated pull request, type: string, required: false, default: ''}
      expected_base_sha: {description: Original immutable candidate base, type: string, required: false, default: ''}
      expected_head_sha: {description: Original immutable candidate head, type: string, required: false, default: ''}
      expected_merge_sha: {description: Original immutable candidate merge, type: string, required: false, default: ''}

permissions:
  contents: read

concurrency:
  # Keep the existing mutex across the rename, including older in-flight runs.
  group: branch-cleanup-noah-be-overte
  cancel-in-progress: false

jobs:
  cleanup:
    name: Verify, back up, and retire integrated branches
    if: >-
      github.repository == 'noah-l-frank/overte' &&
      github.repository_id == '1319052603' &&
      github.workflow_ref == 'noah-l-frank/overte/.github/workflows/branch-cleanup.yml@refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push' ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        ((github.event.workflow_run.workflow_id == 386334598 && github.event.workflow_run.head_branch == 'main') ||
         contains(fromJSON('[330869250,330869251,330556274,340529251,372770820,371274083,373796501,359712487,331326815,357615945,367914894,330643004,330644216,330643006,330551824,366778169,350430503,350930894,350930895]'), github.event.workflow_run.workflow_id))))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BRANCH_CLEANUP_IMMUTABLE_CACHE: '1'
    permissions:
      contents: write
      actions: read
      checks: read
      deployments: read
      pull-requests: read
      issues: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out trusted fork main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: noah-l-frank/overte
          ref: main
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/branch-cleanup/
            /tools/branch-policy/check.py
            /.github/branch-cleanup.json
            /.github/branch-policy.json
            /.github/repository-checks.json

      - name: Check current closed-PR hints after an authenticated completion
        id: retry
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/branch-cleanup"
          python3 tools/branch-cleanup/cleanup.py retry \
            --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT" \
            --report "$RUNNER_TEMP/branch-cleanup/retry.json"

      - name: Check the authenticated explicit synchronization completion
        id: callback
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sync-completion'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/branch-cleanup"
          python3 tools/branch-cleanup/cleanup.py retry-sync-completion \
            --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT" \
            --report "$RUNNER_TEMP/branch-cleanup/sync-completion.json"

      - name: Create repository-scoped history integration token
        id: history-token
        if: >-
          github.event_name != 'workflow_run' &&
          (github.event_name != 'workflow_dispatch' || inputs.mode != 'sync-completion') &&
          vars.BRANCH_SYNC_APP_CLIENT_ID != '' &&
          (github.event_name != 'workflow_dispatch' || inputs.mode == 'apply')
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.BRANCH_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.BRANCH_SYNC_APP_PRIVATE_KEY }}
          owner: noah-l-frank
          repositories: overte
          permission-contents: write
          permission-pull-requests: write

      - name: Assess adopted work and maintain checked history PRs
        id: history
        if: github.event_name != 'workflow_run' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'sync-completion')
        env:
          GH_TOKEN: ${{ github.token }}
          ADOPTION_APP_TOKEN: ${{ steps.history-token.outputs.token }}
          ADOPTION_APP_SLUG: ${{ steps.history-token.outputs.app-slug }}
          ADOPTION_APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/branch-cleanup"
          mode_args=()
          if [[ "$ADOPTION_APPLY" == true ]]; then
            mode_args=(--apply)
          fi
          python3 tools/branch-cleanup/adoption.py \
            --report "$RUNNER_TEMP/branch-cleanup/adoption.json" "${mode_args[@]}"

      - name: Refresh trusted main after a history-only main merge
        if: steps.history.outputs.main_advanced == 'true' && steps.history.outputs.deferred != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: noah-l-frank/overte
          ref: main
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/branch-cleanup/
            /tools/branch-policy/check.py
            /.github/branch-cleanup.json
            /.github/branch-policy.json
            /.github/repository-checks.json

      - name: Plan from current GitHub state
        id: plan
        if: >-
          steps.history.outputs.deferred != 'true' &&
          (github.event_name != 'workflow_run' || steps.retry.outputs.retry == 'true') &&
          (github.event_name != 'workflow_dispatch' || inputs.mode != 'sync-completion' || steps.callback.outputs.retry == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/branch-cleanup"
          python3 tools/branch-cleanup/cleanup.py plan \
            --output "$RUNNER_TEMP/branch-cleanup/plan.json" \
            --report "$RUNNER_TEMP/branch-cleanup/report.json"

      - name: Build and verify a self-contained Git backup
        if: >-
          fromJSON(steps.plan.outputs.candidate_count || '0') > 0 &&
          (github.event_name != 'workflow_dispatch' || inputs.mode == 'apply' ||
           (inputs.mode == 'sync-completion' && steps.callback.outputs.retry == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/branch-cleanup/cleanup.py backup \
            --plan "$RUNNER_TEMP/branch-cleanup/plan.json" \
            --output-dir "$RUNNER_TEMP/branch-cleanup/backup"

      - name: Persist verified backup before any branch deletion
        id: backup
        if: >-
          fromJSON(steps.plan.outputs.candidate_count || '0') > 0 &&
          (github.event_name != 'workflow_dispatch' || inputs.mode == 'apply' ||
           (inputs.mode == 'sync-completion' && steps.callback.outputs.retry == 'true'))
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: branch-cleanup-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/branch-cleanup/backup/recovery.bundle
            ${{ runner.temp }}/branch-cleanup/backup/manifest.json
            ${{ runner.temp }}/branch-cleanup/backup/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Recheck and delete exact branch heads
        if: >-
          fromJSON(steps.plan.outputs.candidate_count || '0') > 0 &&
          (github.event_name != 'workflow_dispatch' || inputs.mode == 'apply' ||
           (inputs.mode == 'sync-completion' && steps.callback.outputs.retry == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_ARTIFACT_ID: ${{ steps.backup.outputs.artifact-id }}
          BACKUP_ARTIFACT_DIGEST: ${{ steps.backup.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BACKUP_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          python3 tools/branch-cleanup/cleanup.py apply \
            --plan "$RUNNER_TEMP/branch-cleanup/plan.json" \
            --report "$RUNNER_TEMP/branch-cleanup/report.json" \
            --backup-artifact-id "$BACKUP_ARTIFACT_ID" \
            --backup-artifact-digest "$BACKUP_ARTIFACT_DIGEST" \
            --backup-dir "$RUNNER_TEMP/branch-cleanup/backup"

      - name: Retain plan and outcome
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: branch-cleanup-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/branch-cleanup/plan.json
            ${{ runner.temp }}/branch-cleanup/report.json
            ${{ runner.temp }}/branch-cleanup/adoption.json
            ${{ runner.temp }}/branch-cleanup/retry.json
            ${{ runner.temp }}/branch-cleanup/sync-completion.json
          if-no-files-found: warn
          retention-days: 14
